<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>Cheap Fuel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Cheap Fuel</h1>
  <div class="sub" id="status">finding you…</div>
</header>

<nav class="tabs">
  <button id="tabNearby" class="on">Nearby</button>
  <button id="tabTrip">Trip</button>
</nav>

<section id="nearbyPane">
<nav class="chips" id="fuelChips">
  <button data-fuel="U91" class="on">91</button>
  <button data-fuel="U95">95</button>
  <button data-fuel="U98">98</button>
  <button data-fuel="DL">Diesel</button>
  <button data-fuel="LPG">LPG</button>
</nav>

<nav class="chips small" id="kmChips">
  <span class="lbl">within</span>
  <button data-km="2">2 km</button>
  <button data-km="5" class="on">5 km</button>
  <button data-km="10">10 km</button>
  <button data-km="25">25 km</button>
</nav>

<main id="nearbyMap"></main>
<main id="list"></main>
</section>

<section id="tripPane" class="hidden">
  <div class="tripbar">
    <input id="fromInput" placeholder="From (blank = my location)" autocomplete="off">
    <input id="toInput" placeholder="Where to? suburb or address" autocomplete="off">
    <nav class="chips small" id="detourChips">
      <button data-km="2">2 km off-route</button>
      <button data-km="5" class="on">5 km</button>
      <button data-km="15">15 km</button>
      <button id="goTrip" class="go">Find fuel →</button>
    </nav>
    <div class="modes" id="tripModes" style="display:none">
      <button data-mode="close">Closest</button>
      <button data-mode="price">Best price</button>
      <button data-mode="blend" class="on">Blend</button>
    </div>
    <nav class="chips small" id="tripFuel"></nav>
    <label class="wooliesToggle"><input type="checkbox" id="wooliesToggle" checked> Woolies 4c/L off</label>
  </div>
  <div id="map"></div>
  <div id="tripStatus" class="sub"></div>
  <main id="tripList"></main>
</section>

<div id="empty" class="empty hidden">
  <p>No stations found.</p>
  <button onclick="locate()">Try again</button>
</div>

<button id="refresh" title="Refresh">&#8635;</button>

<footer>Data: NSW FuelCheck, QLD Gov, WA FuelWatch. Personal app, no tracking.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="app.js"></script>
</body>
</html>
